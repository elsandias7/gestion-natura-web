<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Blog, Gestión Natura</title>
  <meta name="description" content="Artículo del blog de Gestión Natura.">
  <meta name="theme-color" content="#0B120C">
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=30">
  <style>
    .post-body { max-width: 72ch; margin: 0 auto; }
    .post-body .cover { border-radius: var(--radius-lg); overflow: hidden; margin-bottom: var(--space-6); box-shadow: var(--shadow-md); }
    .post-body .cover img { width: 100%; height: auto; display: block; }
    .post-body .content { font-size: 1.08rem; line-height: 1.75; color: var(--text); white-space: pre-line; }
    .post-empty { text-align: center; padding: 40px 0; }
    .post-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; margin-top: var(--space-6); }
    .post-gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .news-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: clamp(24px,4vw,44px); box-shadow: var(--shadow-md); }
    .news-card .cover { margin-bottom: var(--space-5); }
    .news-card .lead { font-size: 1.22rem; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
    .news-source { display: flex; align-items: center; gap: .5rem; font-family: var(--font-mono); font-size: .82rem; color: var(--text-muted); margin: var(--space-5) 0; padding-top: var(--space-5); border-top: 1px solid var(--border); }
    .news-source svg { width: 16px; height: 16px; flex: 0 0 auto; }
  </style>
</head>
<body data-page="blog.html">

  <section class="pagehero">
    <div class="pagehero-media"><img src="assets/img/photos/hero-relleno.jpg?v=2" alt="Blog de Gestión Natura"></div>
    <div class="pagehero-overlay"></div>
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Inicio</a> / <a href="blog.html">Blog</a> / <span id="crumbTitle">Artículo</span></p>
      <h1 id="postTitleHeading">Cargando artículo…</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="post-body" id="postBody">
        <div class="post-empty" id="postLoading">
          <p>Cargando…</p>
        </div>
      </div>
    </div>
  </section>

  <script src="assets/js/icons.js?v=1"></script>
  <script src="assets/js/site.js?v=9"></script>
  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/supabase.config.js?v=2"></script>
  <script>
    (function () {
      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      document.addEventListener("DOMContentLoaded", function () {
        var slug = new URLSearchParams(location.search).get("slug");
        var body = document.getElementById("postBody");
        var heading = document.getElementById("postTitleHeading");
        var crumb = document.getElementById("crumbTitle");

        function showMissing(msg) {
          heading.textContent = "Artículo no disponible";
          body.innerHTML = '<div class="post-empty"><p>' + msg + '</p><p class="mt-5"><a class="btn btn-forest" href="blog.html">Volver al blog</a></p></div>';
        }

        if (!slug) { showMissing("No se especificó un artículo."); return; }
        if (!window.GN_DB) { showMissing("El blog aún no está conectado a la base de datos. Vuelve pronto."); return; }

        window.GN_DB.from("blog_posts").select("*").eq("slug", slug).eq("published", true).maybeSingle()
          .then(function (res) {
            if (res.error || !res.data) { showMissing("No encontramos este artículo, puede que ya no esté disponible."); return; }
            var p = res.data;
            document.title = p.title + ", Gestión Natura";
            heading.textContent = p.title;
            crumb.textContent = p.title;

            if (p.external_url) {
              var host = "";
              try { host = new URL(p.external_url).hostname.replace(/^www\./, ""); } catch (e) {}
              body.innerHTML =
                '<div class="news-card">' +
                  (p.cover_image_url ? '<div class="cover"><img src="' + p.cover_image_url + '" alt="' + escapeHtml(p.title) + '"></div>' : "") +
                  (p.category ? '<span class="tile-tag">' + escapeHtml(p.category) + "</span>" : "") +
                  "<h2>" + escapeHtml(p.title) + "</h2>" +
                  (p.excerpt ? '<p class="lead mt-5">' + escapeHtml(p.excerpt) + "</p>" : "") +
                  (host ? '<div class="news-source"><span data-ic="link"></span> Fuente: ' + escapeHtml(host) + "</div>" : "") +
                  '<a class="btn btn-primary" href="' + p.external_url + '" target="_blank" rel="noopener">Leer la noticia completa <span class="arrow" data-ic="arrowUR"></span></a>' +
                "</div>";
              window.GN_fillIcons(body);
              return;
            }

            var gallery = (p.images && p.images.length)
              ? '<div class="post-gallery">' + p.images.map(function (u) { return '<img src="' + u + '" alt="' + escapeHtml(p.title) + '">'; }).join("") + "</div>"
              : "";
            body.innerHTML =
              (p.cover_image_url ? '<div class="cover"><img src="' + p.cover_image_url + '" alt="' + escapeHtml(p.title) + '"></div>' : "") +
              '<div class="content">' + escapeHtml(p.content || p.excerpt || "") + "</div>" +
              gallery;
          })
          .catch(function () { showMissing("Ocurrió un problema al cargar el artículo."); });
      });
    })();
  </script>
</body>
</html>
